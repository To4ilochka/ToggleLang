name: Bug Report
description: Report a crash, layout mismatch, UI glitch, or unexpected behavior in ToggleLang
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please fill out the details below so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Install layouts EN, RU, UK
        2. Run `togglelang.exe`
        3. Toggle off UK in the flyout
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ToggleLang Version
      description: Release tag (e.g. `v0.1.0`) or commit SHA
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows Version
      description: Run `winver` to see your Windows 11 version and build number.
      placeholder: Windows 11 24H2 (Build 26100.xxxx)
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (`togglelang inspect` & `crash.log`)
      description: Output of `togglelang inspect` and any relevant lines from `%LOCALAPPDATA%\ToggleLang\crash.log` (optional, very helpful for layout/IME bugs).
      render: text
    validations:
      required: false
