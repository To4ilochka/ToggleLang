name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $expectedVersion = $tag.TrimStart('v')
          $cargoToml = Get-Content -Raw Cargo.toml
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not parse package version from Cargo.toml"
          }
          $crateVersion = $Matches[1]
          if ($crateVersion -ne $expectedVersion) {
            throw "Git tag '$tag' does not match Cargo.toml version '$crateVersion'"
          }
          Write-Host "Verified tag $tag matches Cargo.toml version $crateVersion"

      - name: Run unit tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build standalone release executable
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package release assets and SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $binSrc = "target/x86_64-pc-windows-msvc/release/togglelang.exe"
          $exeName = "togglelang-$tag-x86_64-windows.exe"
          $zipName = "togglelang-$tag-x86_64-windows.zip"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path stage | Out-Null

          # 1. Direct standalone executable
          Copy-Item $binSrc "dist/$exeName"

          # 2. Portable zip archive (exe + README + LICENSE)
          Copy-Item $binSrc "stage/togglelang.exe"
          Copy-Item "README.md" "stage/README.md"
          Copy-Item "LICENSE" "stage/LICENSE"
          Compress-Archive -Path "stage/*" -DestinationPath "dist/$zipName" -Force

          # 3. SHA256SUMS.txt
          $checksumLines = foreach ($file in @($exeName, $zipName)) {
            $hash = (Get-FileHash -Path "dist/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $checksumLines -join "`n" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding utf8NoBOM

          Get-ChildItem dist | Format-Table Name, Length
          Write-Host "--- SHA256SUMS.txt ---"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Prepare release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          $escapedVer = [regex]::Escape($ver)
          $notes = @()

          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $inSection = $false
            $sectionLines = @()
            foreach ($line in $lines) {
              if ($line -match "^## \[$escapedVer\]") {
                $inSection = $true
                continue
              }
              if ($inSection -and ($line -match '^## \[' -or $line -match '^\[[^\]]+\]:\s*http')) {
                break
              }
              if ($inSection) {
                $sectionLines += $line
              }
            }
            $body = ($sectionLines -join "`n").Trim()
            if ($body) {
              $notes += $body
            }
          }

          $bt = '`'
          $downloads = @(
            '### Downloads',
            "- **${bt}togglelang-$tag-x86_64-windows.exe${bt}** — Standalone portable executable (ready to run, no installer required).",
            "- **${bt}togglelang-$tag-x86_64-windows.zip${bt}** — Portable archive containing ${bt}togglelang.exe${bt}, ${bt}README.md${bt}, and ${bt}LICENSE${bt}.",
            "- **${bt}SHA256SUMS.txt${bt}** — SHA-256 checksums for verifying download integrity."
          ) -join "`n"
          $notes += $downloads

          ($notes -join "`n`n") | Set-Content -Path "dist/release-notes.md" -Encoding utf8NoBOM

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $exePath = "dist/togglelang-$tag-x86_64-windows.exe"
          $zipPath = "dist/togglelang-$tag-x86_64-windows.zip"
          $sumsPath = "dist/SHA256SUMS.txt"

          $ghArgs = @(
            'release', 'create', $tag,
            $exePath, $zipPath, $sumsPath,
            '--title', "ToggleLang $tag",
            '--notes-file', 'dist/release-notes.md',
            '--generate-notes',
            '--verify-tag'
          )
          if ($tag -match '-') {
            $ghArgs += '--prerelease'
          }

          gh @ghArgs
